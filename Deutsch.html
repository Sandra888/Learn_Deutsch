<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lern das deutsche ABC</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --ink:#2b2438;
      --sub:#6b6485;
      --cream:#fff6e9;
      --card:#fffdf8;
      --line:#e7dcc8;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:'Nunito',sans-serif;
      color:var(--ink);
      background-color:var(--cream);
      background-image:
        radial-gradient(circle at 8px 8px, rgba(43,36,56,0.045) 1.4px, transparent 1.4px);
      background-size:26px 26px;
      min-height:100vh;
    }

    .hero {
      text-align:center;
      padding:56px 20px 28px;
      position:relative;
    }

    .hero .flagbar {
      display:inline-flex;
      gap:5px;
      margin-bottom:18px;
    }
    .flagbar span {
      width:34px; height:8px; border-radius:4px;
    }
    .flagbar span:nth-child(1){ background:#1a1a1a; }
    .flagbar span:nth-child(2){ background:#d00027; }
    .flagbar span:nth-child(3){ background:#ffce00; }

    .hero h1 {
      font-family:'Baloo 2',cursive;
      font-weight:800;
      font-size:clamp(2.2rem, 5vw, 3.4rem);
      color:var(--ink);
      margin:0;
      letter-spacing:-0.5px;
    }

    .hero h1 .accent {
      color:#d00027;
    }

    .hero p {
      font-weight:700;
      color:var(--sub);
      margin-top:10px;
      font-size:1.05rem;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:28px 22px;
      padding:10px 28px 70px;
      max-width:1240px;
      margin:auto;
    }

    .card {
      background:var(--card);
      border-radius:14px;
      border:1px solid var(--line);
      box-shadow:0 10px 22px rgba(43,36,56,0.10);
      overflow:visible;
      position:relative;
      padding:26px 18px 18px;
      transition:transform 0.25s ease, box-shadow 0.25s ease;
    }

    /* alternating pinboard tilt */
    .grid .card:nth-child(6n+1){ transform:rotate(-1.6deg); }
    .grid .card:nth-child(6n+2){ transform:rotate(1.2deg); }
    .grid .card:nth-child(6n+3){ transform:rotate(-0.8deg); }
    .grid .card:nth-child(6n+4){ transform:rotate(1.8deg); }
    .grid .card:nth-child(6n+5){ transform:rotate(-1.2deg); }
    .grid .card:nth-child(6n+6){ transform:rotate(0.9deg); }

    .card:hover, .card:focus-within {
      transform:rotate(0deg) translateY(-4px);
      box-shadow:0 16px 30px rgba(43,36,56,0.16);
      z-index:2;
    }

    .tape {
      position:absolute;
      top:-12px;
      left:50%;
      width:64px;
      height:22px;
      transform:translateX(-50%) rotate(-3deg);
      border-radius:2px;
      opacity:0.85;
    }

    .badge {
      width:64px;
      height:64px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-family:'Baloo 2',cursive;
      font-weight:800;
      font-size:1.9rem;
      text-transform:lowercase;
      border:3px solid var(--card);
      box-shadow:0 4px 0 rgba(0,0,0,0.15);
      margin:0 auto 12px;
    }

    .letterlabel {
      text-align:center;
      font-family:'Space Mono', monospace;
      font-size:0.72rem;
      color:var(--sub);
      letter-spacing:0.5px;
      margin-bottom:14px;
    }

    .emoji {
      font-size:2.6rem;
      text-align:center;
      margin:4px 0 8px;
    }

    .word {
      font-size:1.28rem;
      font-weight:800;
      color:var(--ink);
      text-align:center;
      font-family:'Baloo 2', cursive;
    }

    .pron {
      font-family:'Space Mono', monospace;
      font-size:0.82rem;
      color:var(--sub);
      text-align:center;
      margin-top:2px;
      margin-bottom:14px;
    }

    .btns {
      display:flex;
      gap:8px;
    }

    button {
      flex:1;
      padding:10px 6px;
      border:none;
      border-radius:10px;
      color:white;
      font-weight:800;
      font-family:'Nunito', sans-serif;
      cursor:pointer;
      transition:transform 0.15s ease, filter 0.15s ease;
      font-size:0.85rem;
      background:#3d3560;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
    }

    button.word-btn {
      background:#d00027;
    }

    button:hover { filter:brightness(1.08); }
    button:active { transform:scale(0.95); }

    button:focus-visible, .card:focus-visible {
      outline:3px solid #4EA8DE;
      outline-offset:2px;
    }

    button.playing {
      animation:pulse 0.4s ease;
    }
    @keyframes pulse {
      0% { transform:scale(1); }
      40% { transform:scale(0.93); }
      100% { transform:scale(1); }
    }

    footer {
      text-align:center;
      padding:10px 20px 40px;
      font-weight:700;
      color:var(--sub);
      font-size:0.9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .card, button { transition:none; }
      button.playing { animation:none; }
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="flagbar"><span></span><span></span><span></span></div>
    <h1>Lern das deutsche <span class="accent">ABC</span></h1>
    <p>Tippe auf eine Karte für die deutsche Aussprache 🎧</p>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Deutsch macht Spaß! 🌈</footer>

  <script>
    // curated sticker palette
    const COLORS = [
      "#FF5A5F", "#FFB627", "#3DDC97", "#4EA8DE",
      "#9B5DE5", "#FF6FB5", "#FF8C42", "#2EC4B6"
    ];

    // what's SHOWN on the card as the phonetic caption (original spelling)
    const letterDisplay = {
      A:"ah", B:"beh", C:"tseh", D:"deh", E:"eh", F:"eff", G:"geh", H:"hah",
      I:"ee", J:"yot", K:"kah", L:"ell", M:"emm", N:"enn", O:"oh", P:"peh",
      Q:"koo", R:"err", S:"ess", T:"teh", U:"oo", V:"fau", W:"veh", X:"iks",
      Y:"üpsilon", Z:"tsett",
      Ä:"äh", Ö:"ö", Ü:"ü", ß:"ess-tsett"
    };

    // what's SPOKEN by the German TTS voice (spelled using real German
    // graphemes/words so any de-DE voice reads them correctly)
    const letterSpeech = {
      A:"ah", B:"beh", C:"zeh", D:"deh", E:"eh", F:"eff", G:"geh", H:"hah",
      I:"ie", J:"jot", K:"kah", L:"ell", M:"emm", N:"enn", O:"oh", P:"peh",
      Q:"Kuh", R:"er", S:"ess", T:"teh", U:"Uhr", V:"fau", W:"weh", X:"iks",
      Y:"Ypsilon", Z:"zett",
      Ä:"äh", Ö:"ö", Ü:"ü", ß:"ess-zett"
    };

    // data: each entry has the letter, an example word, and a simple
    // phonetic respelling of how that WORD is actually pronounced in German
    const data = [
      { upper:'A', lower:'a', example:'Apfel',    pron:'AP-fel',        emoji:'🍎' },
      { upper:'B', lower:'b', example:'Ball',     pron:'bahl',          emoji:'⚽' },
      { upper:'C', lower:'c', example:'Computer', pron:'kom-PYOO-ter',  emoji:'💻' },
      { upper:'D', lower:'d', example:'Dose',     pron:'DOH-zuh',       emoji:'🥤' },
      { upper:'E', lower:'e', example:'Ei',       pron:'eye',           emoji:'🥚' },
      { upper:'F', lower:'f', example:'Fisch',    pron:'fish',          emoji:'🐟' },
      { upper:'G', lower:'g', example:'Garten',   pron:'GAR-ten',       emoji:'🌳' },
      { upper:'H', lower:'h', example:'Haus',     pron:'house',         emoji:'🏡' },
      { upper:'I', lower:'i', example:'Insel',    pron:'IN-zel',        emoji:'🏝️' },
      { upper:'J', lower:'j', example:'Jacke',    pron:'YAH-kuh',       emoji:'🧥' },
      { upper:'K', lower:'k', example:'Kuchen',   pron:'KOO-khen',      emoji:'🎂' },
      { upper:'L', lower:'l', example:'Löwe',     pron:'LOE-vuh',       emoji:'🦁' },
      { upper:'M', lower:'m', example:'Maus',     pron:'mouse',         emoji:'🐭' },
      { upper:'N', lower:'n', example:'Nacht',    pron:'nakht',         emoji:'🌙' },
      { upper:'O', lower:'o', example:'Obst',     pron:'ohpst',         emoji:'🍊' },
      { upper:'P', lower:'p', example:'Pferd',    pron:'pfairt',        emoji:'🐴' },
      { upper:'Q', lower:'q', example:'Qualle',   pron:'KVAH-luh',      emoji:'🪼' },
      { upper:'R', lower:'r', example:'Radio',    pron:'RAH-dee-oh',    emoji:'📻' },
      { upper:'S', lower:'s', example:'Sonne',    pron:'ZAW-nuh',       emoji:'☀️' },
      { upper:'T', lower:'t', example:'Tisch',    pron:'tish',          emoji:'🪑' },
      { upper:'U', lower:'u', example:'Uhr',      pron:'oor',           emoji:'⏰' },
      { upper:'V', lower:'v', example:'Vogel',    pron:'FOH-gel',       emoji:'🐦' },
      { upper:'W', lower:'w', example:'Wasser',   pron:'VAH-ser',       emoji:'💧' },
      { upper:'X', lower:'x', example:'Xylophon', pron:'ksew-loh-FOHN', emoji:'🎼' },
      { upper:'Y', lower:'y', example:'Yoga',     pron:'YOH-gah',       emoji:'🧘' },
      { upper:'Z', lower:'z', example:'Zug',      pron:'tsook',         emoji:'🚂' },
      { upper:'Ä', lower:'ä', example:'Äpfel',    pron:'EP-fel',        emoji:'🍏' },
      { upper:'Ö', lower:'ö', example:'Öl',       pron:'url',           emoji:'🫙' },
      { upper:'Ü', lower:'ü', example:'Bücher',   pron:'BUE-cher',      emoji:'📚' },
      { upper:'ß', lower:'ß', example:'Straße',   pron:'SHTRAH-suh',    emoji:'🛣️' }
    ];

    let germanVoice = null;

    function initGermanVoice() {
      const voices = speechSynthesis.getVoices();
      germanVoice = voices.find(v => v.lang.startsWith("de")) || voices[0];
    }

    initGermanVoice();
    speechSynthesis.onvoiceschanged = initGermanVoice;

    document.addEventListener("click", unlockSpeech, { once:true });
    document.addEventListener("touchstart", unlockSpeech, { once:true });

    function unlockSpeech() {
      const unlock = new SpeechSynthesisUtterance("eins zwei drei");
      unlock.lang = "de-DE";
      unlock.volume = 0;
      unlock.rate = 1.0;
      speechSynthesis.speak(unlock);
      setTimeout(() => speechSynthesis.cancel(), 50);
    }

    function speak(text, rate = 0.55) {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "de-DE";
      utterance.voice = germanVoice;
      utterance.rate = rate;
      utterance.pitch = 1.0;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }

    function pulse(btn) {
      btn.classList.remove("playing");
      void btn.offsetWidth;
      btn.classList.add("playing");
    }

    function speakLetter(letter, btn) {
      pulse(btn);
      speak(letterSpeech[letter] || letter, 0.55);
    }

    function speakWord(word, btn) {
      pulse(btn);
      speak(word, 0.55);
    }

    function render() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      data.forEach((item, i) => {
        const color = COLORS[i % COLORS.length];
        const tapeColor = COLORS[(i + 3) % COLORS.length];

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="tape" style="background:${tapeColor}"></div>
          <div class="badge" style="background:${color}">${item.lower}</div>
          <div class="letterlabel">/${letterDisplay[item.upper]}/</div>
          <div class="emoji">${item.emoji}</div>
          <div class="word">${item.example}</div>
          <div class="pron">/${item.pron}/</div>
          <div class="btns">
            <button class="letter-btn">🔤 Buchstabe</button>
            <button class="word-btn">🔊 Wort</button>
          </div>
        `;

        card.querySelector(".letter-btn").addEventListener("click", (e) => speakLetter(item.upper, e.currentTarget));
        card.querySelector(".word-btn").addEventListener("click", (e) => speakWord(item.example, e.currentTarget));

        grid.appendChild(card);
      });
    }

    render();
  </script>

</body>
</html>
