<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🇩🇪 Learn German ABC</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Baloo+2:wght@700;900&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:#fff8f0;
  --text:#1a1a2e;
  --sub:#5f5f8a;
}

body {
  margin:0;
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a1c4fd,#c2ffd8);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
}

@keyframes bg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.hero {
  text-align:center;
  padding:40px 20px 20px;
}

.hero h1 {
  font-family:'Baloo 2',cursive;
  font-size:3rem;
  color:#ff2e88;
  margin:0;
}

.hero p {
  font-weight:700;
  color:#4a148c;
  margin-top:8px;
}

.filter-bar {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.filter-btn {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:800;
  cursor:pointer;
  background:white;
  transition:0.3s;
}

.filter-btn:hover {
  transform:scale(1.05);
}

.filter-btn.active {
  background:#1a1a2e;
  color:white;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.card {
  background:white;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  overflow:hidden;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.03);
}

.stripe {
  height:6px;
}

.body {
  padding:15px;
}

.top {
  display:flex;
  gap:10px;
  align-items:center;
}

.bubble {
  width:55px;
  height:55px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  font-size:1.5rem;
  text-transform:lowercase;
}

.word {
  font-size:1.3rem;
  font-weight:900;
  color:#1a1a2e;
}

.pron {
  font-size:0.9rem;
  color:#5f5f8a;
}

.emoji {
  font-size:3.5rem;
  text-align:center;
  margin:10px 0;
}

.btns {
  display:flex;
  gap:8px;
  margin-top:10px;
}

button {
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
  font-size:1rem;
}

button:hover {
  transform:translateY(-2px);
}

.slow {
  background:#ff7043;
}

footer {
  text-align:center;
  padding:20px;
  font-weight:800;
  color:#5f5f8a;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🇩🇪 Learn German ABC</h1>
  <p>Tap buttons to hear pronunciation 🎧</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="az">A-Z</button>
  <button class="filter-btn" data-filter="special">Ä Ö Ü ß</button>
</div>

<div class="grid" id="grid"></div>

<footer>German Alphabet Learning App 🌈</footer>

<script>
const COLORS = [
  "#ff3b5c",
  "#ff7b2f",
  "#ffd600",
  "#00d68f",
  "#3d8bff",
  "#9b59ff",
  "#ff5fac"
];

const data = [
  { upper:'A', lower:'a', phonetic:'Ah', example:'Apfel', emoji:'🍎' },
  { upper:'B', lower:'b', phonetic:'Beh', example:'Ball', emoji:'⚽' },
  { upper:'C', lower:'c', phonetic:'Tseh', example:'Computer', emoji:'💻' },
  { upper:'D', lower:'d', phonetic:'Deh', example:'Dach', emoji:'🏠' },
  { upper:'E', lower:'e', phonetic:'Eh', example:'Ei', emoji:'🥚' },
  { upper:'F', lower:'f', phonetic:'Ef', example:'Fisch', emoji:'🐟' },
  { upper:'G', lower:'g', phonetic:'Geh', example:'Garten', emoji:'🌳' },
  { upper:'H', lower:'h', phonetic:'Hah', example:'Haus', emoji:'🏡' },
  { upper:'I', lower:'i', phonetic:'Ih', example:'Insel', emoji:'🏝️' },
  { upper:'J', lower:'j', phonetic:'Yot', example:'Jahr', emoji:'📅' },
  { upper:'K', lower:'k', phonetic:'Kah', example:'Kuchen', emoji:'🎂' },
  { upper:'L', lower:'l', phonetic:'El', example:'Lampe', emoji:'💡' },
  { upper:'M', lower:'m', phonetic:'Em', example:'Maus', emoji:'🐭' },
  { upper:'N', lower:'n', phonetic:'En', example:'Nacht', emoji:'🌙' },
  { upper:'O', lower:'o', phonetic:'Oh', example:'Obst', emoji:'🍊' },
  { upper:'P', lower:'p', phonetic:'Peh', example:'Pferd', emoji:'🐴' },
  { upper:'Q', lower:'q', phonetic:'Kuh', example:'Quelle', emoji:'💧' },
  { upper:'R', lower:'r', phonetic:'Er', example:'Radio', emoji:'📻' },
  { upper:'S', lower:'s', phonetic:'Es', example:'Sonne', emoji:'☀️' },
  { upper:'T', lower:'t', phonetic:'Teh', example:'Tisch', emoji:'🪑' },
  { upper:'U', lower:'u', phonetic:'Uh', example:'Uhr', emoji:'⏰' },
  { upper:'V', lower:'v', phonetic:'Fau', example:'Vogel', emoji:'🐦' },
  { upper:'W', lower:'w', phonetic:'Veh', example:'Wasser', emoji:'💧' },
  { upper:'X', lower:'x', phonetic:'Iks', example:'Xylophon', emoji:'🎼' },
  { upper:'Y', lower:'y', phonetic:'Üpsilon', example:'Yoga', emoji:'🧘' },
  { upper:'Z', lower:'z', phonetic:'Tset', example:'Zug', emoji:'🚂' },

  { upper:'Ä', lower:'ä', phonetic:'Äh', example:'Äpfel', emoji:'🍏', special:true },
  { upper:'Ö', lower:'ö', phonetic:'Öh', example:'Öl', emoji:'🫙', special:true },
  { upper:'Ü', lower:'ü', phonetic:'Üh', example:'Über', emoji:'✈️', special:true },
  { upper:'ß', lower:'ß', phonetic:'Eszett', example:'Straße', emoji:'🛣️', special:true }
];

function speak(text, rate) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "de-DE";
  utterance.rate = rate;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function render(filter = "all") {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const filteredData = data.filter(item => {
    if (filter === "all") return true;
    if (filter === "special") return item.special;
    if (filter === "az") return !item.special;
    return true;
  });

  filteredData.forEach((item, i) => {
    const color = COLORS[i % COLORS.length];

    grid.innerHTML += `
      <div class="card">
        <div class="stripe" style="background:${color}"></div>
        <div class="body">

          <div class="top">
            <div class="bubble" style="background:${color}">
              ${item.lower || item.upper}
            </div>
            <div>
              <div class="word">${item.example}</div>
              <div class="pron">/${item.phonetic}/</div>
            </div>
          </div>

          <div class="emoji">${item.emoji}</div>

          <div class="btns">
            <button class="slow" onclick="speak('${item.lower || item.upper}',0.5)">🔤 Letter</button>
            <button class="slow" onclick="speak('${item.example}',0.5)">🔊 Word</button>
          </div>

        </div>
      </div>
    `;
  });
}

document.querySelectorAll(".filter-btn").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");
    render(button.getAttribute("data-filter"));
  });
});

render();
</script>

</body>
</html>
