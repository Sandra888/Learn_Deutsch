<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🇩🇪 Learn German ABC</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Baloo+2:wght@700;900&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:#fff8f0;
  --text:#1a1a2e;
  --sub:#5f5f8a;
}

body {
  margin:0;
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a1c4fd,#c2ffd8);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
}

@keyframes bg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.hero {
  text-align:center;
  padding:40px 20px 20px;
}

.hero h1 {
  font-family:'Baloo 2',cursive;
  font-size:3rem;
  color:#ff2e88;
}

.hero p {
  font-weight:700;
  color:#4a148c;
}

.filter-bar {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

.filter-btn {
  padding:8px 16px;
  border-radius:999px;
  border:none;
  font-weight:800;
  cursor:pointer;
  background:white;
}

.filter-btn.active {
  background:#1a1a2e;
  color:white;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.card {
  background:white;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  overflow:hidden;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.03);
}

.stripe {
  height:6px;
}

.body {
  padding:15px;
}

.top {
  display:flex;
  gap:10px;
  align-items:center;
}

.bubble {
  width:55px;
  height:55px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  font-size:1.5rem;
}

.word {
  font-size:1.3rem;
  font-weight:900;
  color:#1a1a2e;
}

.pron {
  font-size:0.9rem;
  color:#5f5f8a;
}

.emoji {
  font-size:3.5rem;
  text-align:center;
  margin:10px 0;
}

.btns {
  display:flex;
  gap:8px;
  margin-top:8px;
}

button {
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.slow { background:#ff7043; }
.fast { background:#3d8bff; }

footer {
  text-align:center;
  padding:20px;
  font-weight:800;
  color:#5f5f8a;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🇩🇪 Learn German ABC</h1>
  <p>Tap to hear pronunciation 🎧</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data="all">All</button>
  <button class="filter-btn" data="az">A-Z</button>
  <button class="filter-btn" data="special">Ä Ö Ü ß</button>
</div>

<div class="grid" id="grid"></div>

<footer>German Alphabet Learning App 🌈</footer>

<script>
const COLORS = ["#ff3b5c","#ff7b2f","#ffd600","#00d68f","#3d8bff","#9b59ff","#ff5fac"];

const data = [
  {l:"A a",w:"Apfel",e:"🍎",s:"ah"},
  {l:"B b",w:"Ball",e:"⚽",s:"beh"},
  {l:"C c",w:"Café",e:"☕",s:"tseh"},
  {l:"D d",w:"Dach",e:"🏠",s:"deh"},
  {l:"E e",w:"Essen",e:"🍽️",s:"eh"},
  {l:"F f",w:"Fisch",e:"🐟",s:"eff"},
  {l:"G g",w:"Glas",e:"🥛",s:"geh"},
  {l:"H h",w:"Haus",e:"🏡",s:"hah"},
  {l:"I i",w:"Insel",e:"🏝️",s:"ee"},
  {l:"J j",w:"Jahr",e:"📅",s:"yot"},
  {l:"K k",w:"Kuchen",e:"🎂",s:"kah"},
  {l:"L l",w:"Lampe",e:"💡",s:"ell"},
  {l:"M m",w:"Maus",e:"🐭",s:"emm"},
  {l:"N n",w:"Nacht",e:"🌙",s:"enn"},
  {l:"O o",w:"Obst",e:"🍊",s:"oh"},
  {l:"P p",w:"Pferd",e:"🐴",s:"peh"},
  {l:"Q q",w:"Qualität",e:"⭐",s:"koo"},
  {l:"R r",w:"Radio",e:"📻",s:"err"},
  {l:"S s",w:"Sonne",e:"☀️",s:"ess"},
  {l:"T t",w:"Tisch",e:"🪑",s:"teh"},
  {l:"U u",w:"Uhr",e:"⏰",s:"oo"},
  {l:"V v",w:"Vogel",e:"🐦",s:"veh"},
  {l:"W w",w:"Wasser",e:"💧",s:"veh"},
  {l:"X x",w:"Boxen",e:"🥊",s:"iks"},
  {l:"Y y",w:"Yoga",e:"🧘",s:"üpsilon"},
  {l:"Z z",w:"Zug",e:"🚂",s:"tset"},
  {l:"Ä ä",w:"Äpfel",e:"🍏",s:"eh",sp:true},
  {l:"Ö ö",w:"Öl",e:"🫙",s:"ur",sp:true},
  {l:"Ü ü",w:"Über",e:"✈️",s:"ee rounded",sp:true},
  {l:"ß",w:"Straße",e:"🛣️",s:"ss",sp:true}
];

function speak(t,r){
  const u=new SpeechSynthesisUtterance(t);
  u.lang="de-DE";
  u.rate=r;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function render(filter="all"){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  data.filter(x=>{
    if(filter==="all") return true;
    if(filter==="special") return x.sp;
    return !x.sp;
  }).forEach((x,i)=>{

    const color=COLORS[i%COLORS.length];

    grid.innerHTML+=`
    <div class="card">
      <div class="stripe" style="background:${color}"></div>
      <div class="body">

        <div class="top">
          <div class="bubble" style="background:${color}">${x.l}</div>
          <div>
            <div class="word">${x.w}</div>
            <div class="pron">/${x.s}/</div>
          </div>
        </div>

        <div class="emoji">${x.e}</div>

        <div class="btns">
          <button class="slow" onclick="speak('${x.w}',0.5)">Word</button>
          <button class="fast" onclick="speak('${x.w}',1)">Word</button>
        </div>

        <div class="btns">
          <button class="slow" onclick="speak('${x.l}',0.5)">Letter</button>
          <button class="fast" onclick="speak('${x.l}',1)">Letter</button>
        </div>

      </div>
    </div>`;
  });
}

document.querySelectorAll(".filter-btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render(b.getAttribute("data"));
  };
});

render();
</script>

</body>
</html>
