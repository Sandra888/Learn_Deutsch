<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🇩🇪 Learn German ABC</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Baloo+2:wght@700;900&display=swap" rel="stylesheet"/>

<style>
:root {
  --text:#1a1a2e;
  --sub:#5f5f8a;
}

body {
  margin:0;
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a1c4fd,#c2ffd8);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
}

@keyframes bg {
  0% { background-position:0% 50% }
  50% { background-position:100% 50% }
  100% { background-position:0% 50% }
}

.hero {
  text-align:center;
  padding:40px 20px 20px;
}

.hero h1 {
  font-family:'Baloo 2',cursive;
  font-size:3rem;
  color:#ff2e88;
  margin:0;
}

.hero p {
  font-weight:700;
  color:#4a148c;
  margin-top:8px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.card {
  background:white;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  overflow:hidden;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.03);
}

.stripe {
  height:6px;
}

.body {
  padding:15px;
}

.top {
  display:flex;
  gap:10px;
  align-items:center;
}

.bubble {
  width:55px;
  height:55px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  font-size:1.5rem;
  text-transform:lowercase;
}

.word {
  font-size:1.3rem;
  font-weight:900;
  color:var(--text);
}

.pron {
  font-size:1rem;
  color:var(--sub);
}

.emoji {
  font-size:3.5rem;
  text-align:center;
  margin:10px 0;
}

.btns {
  display:flex;
  gap:8px;
  margin-top:10px;
}

button {
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
  font-size:1rem;
  background:#ff7043;
}

button:hover {
  transform:translateY(-2px);
}

footer {
  text-align:center;
  padding:20px;
  font-weight:800;
  color:#5f5f8a;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🇩🇪 Learn German ABC</h1>
  <p>Tap for spontaneous slow German pronunciation 🎧</p>
</div>

<div class="grid" id="grid"></div>

<footer>German Alphabet Learning App 🌈</footer>

<script>
const COLORS = [
  "#ff3b5c",
  "#ff7b2f",
  "#ffd600",
  "#00d68f",
  "#3d8bff",
  "#9b59ff",
  "#ff5fac"
];

// Real German sounds
const germanSounds = {
  A:"ah", B:"beh", C:"tseh", D:"deh", E:"eh", F:"eff", G:"geh", H:"hah",
  I:"ee", J:"yot", K:"kah", L:"ell", M:"emm", N:"enn", O:"oh", P:"peh",
  Q:"koo", R:"err", S:"ess", T:"teh", U:"oo", V:"fow", W:"veh", X:"iks",
  Y:"üp-si-lon", Z:"tsett", Ä:"eh", Ö:"ur", Ü:"ue", ß:"es-tsett"
};

const data = [
  { upper:'A', lower:'a', phonetic:'ah', example:'Apfel', emoji:'🍎' },
  { upper:'B', lower:'b', phonetic:'beh', example:'Ball', emoji:'⚽' },
  { upper:'C', lower:'c', phonetic:'tseh', example:'Computer', emoji:'💻' },
  { upper:'D', lower:'d', phonetic:'deh', example:'Dach', emoji:'🏠' },
  { upper:'E', lower:'e', phonetic:'eh', example:'Ei', emoji:'🥚' },
  { upper:'F', lower:'f', phonetic:'eff', example:'Fisch', emoji:'🐟' },
  { upper:'G', lower:'g', phonetic:'geh', example:'Garten', emoji:'🌳' },
  { upper:'H', lower:'h', phonetic:'hah', example:'Haus', emoji:'🏡' },
  { upper:'I', lower:'i', phonetic:'ee', example:'Insel', emoji:'🏝️' },
  { upper:'J', lower:'j', phonetic:'yot', example:'Jahr', emoji:'📅' },
  { upper:'K', lower:'k', phonetic:'kah', example:'Kuchen', emoji:'🎂' },
  { upper:'L', lower:'l', phonetic:'ell', example:'Lampe', emoji:'💡' },
  { upper:'M', lower:'m', phonetic:'emm', example:'Maus', emoji:'🐭' },
  { upper:'N', lower:'n', phonetic:'enn', example:'Nacht', emoji:'🌙' },
  { upper:'O', lower:'o', phonetic:'oh', example:'Obst', emoji:'🍊' },
  { upper:'P', lower:'p', phonetic:'peh', example:'Pferd', emoji:'🐴' },
  { upper:'Q', lower:'q', phonetic:'koo', example:'Quelle', emoji:'💧' },
  { upper:'R', lower:'r', phonetic:'err', example:'Radio', emoji:'📻' },
  { upper:'S', lower:'s', phonetic:'ess', example:'Sonne', emoji:'☀️' },
  { upper:'T', lower:'t', phonetic:'teh', example:'Tisch', emoji:'🪑' },
  { upper:'U', lower:'u', phonetic:'oo', example:'Uhr', emoji:'⏰' },
  { upper:'V', lower:'v', phonetic:'fow', example:'Vogel', emoji:'🐦' },
  { upper:'W', lower:'w', phonetic:'veh', example:'Wasser', emoji:'💧' },
  { upper:'X', lower:'x', phonetic:'iks', example:'Xylophon', emoji:'🎼' },
  { upper:'Y', lower:'y', phonetic:'üp-si-lon', example:'Yoga', emoji:'🧘' },
  { upper:'Z', lower:'z', phonetic:'tsett', example:'Zug', emoji:'🚂' },
  { upper:'Ä', lower:'ä', phonetic:'eh', example:'Äpfel', emoji:'🍏' },
  { upper:'Ö', lower:'ö', phonetic:'ur', example:'Öl', emoji:'🫙' },
  { upper:'Ü', lower:'ü', phonetic:'ue', example:'Über', emoji:'✈️' },
  { upper:'ß', lower:'ß', phonetic:'es-tsett', example:'Straße', emoji:'🛣️' }
];

// Instant voice setup
let germanVoice = null;

function initGermanVoice() {
  const voices = speechSynthesis.getVoices();

  germanVoice = voices.find(voice =>
    voice.lang === "de-DE" ||
    voice.lang === "de-AT" ||
    voice.lang === "de-CH" ||
    voice.lang.startsWith("de")
  ) || voices[0];
}

initGermanVoice();
speechSynthesis.onvoiceschanged = initGermanVoice;

// Unlock for mobile + instant sound
document.addEventListener("click", unlockSpeech, { once:true });
document.addEventListener("touchstart", unlockSpeech, { once:true });

function unlockSpeech() {
  const unlock = new SpeechSynthesisUtterance(".");
  unlock.volume = 0;
  speechSynthesis.speak(unlock);
  speechSynthesis.cancel();
}

// Spontaneous + slow speech
function speak(text, rate = 0.28) {
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "de-DE";
  utterance.voice = germanVoice;
  utterance.rate = rate;
  utterance.pitch = 0.85;
  utterance.volume = 1;

  setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 0);
}

function speakLetter(letter) {
  speak(germanSounds[letter] || letter, 0.22);
}

function speakWord(word) {
  speak(word, 0.28);
}

// Render cards
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.forEach((item, i) => {
    const color = COLORS[i % COLORS.length];

    grid.innerHTML += `
      <div class="card">
        <div class="stripe" style="background:${color}"></div>

        <div class="body">
          <div class="top">
            <div class="bubble" style="background:${color}">
              ${item.lower}
            </div>

            <div>
              <div class="word">${item.example}</div>
              <div class="pron">/${item.phonetic}/</div>
            </div>
          </div>

          <div class="emoji">${item.emoji}</div>

          <div class="btns">
            <button onclick="speakLetter('${item.upper}')">🔊 Letter</button>
            <button onclick="speakWord('${item.example}')">🔊 Word</button>
          </div>
        </div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
